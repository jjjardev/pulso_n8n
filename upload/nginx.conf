# nginx config for the Review Pulso upload page.
#
# This file exists for ONE reason: CORS.
#
# THE BUG IT FIXES
# The page is served from http://localhost:8080 and the JavaScript POSTs to
# http://localhost:5678. Those are DIFFERENT ORIGINS (different port), so the
# browser treats it as cross-origin. A multipart POST is not a "simple"
# request, so the browser first sends an OPTIONS preflight, and then REQUIRES
# an `Access-Control-Allow-Origin` header on the actual response. n8n returns
# no such header - the preflight returns HTTP 500 - so the browser blocks the
# response and JavaScript sees a bare `TypeError: NetworkError` with no useful
# detail. That is exactly the error the user hit.
#
# THE FIX
# Proxy /webhook/ through nginx to n8n. Now the browser only ever talks to
# ONE origin (localhost:8080), so the request is same-origin, no preflight
# happens, and no CORS headers are needed. This is the standard solution and
# it also means one fewer thing that can break when n8n is upgraded.
#
# nginx is NOT exposed to the LAN (bound to 127.0.0.1 in compose), so this
# does not widen the attack surface.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A 1000-row CSV is tiny, but be generous rather than have a client hit a
    # mysterious 413 on a slow connection.
    client_max_body_size 25m;

    # ---- the page itself ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- proxy n8n's webhook ----
    location /webhook/ {
        proxy_pass         http://n8n:5678/webhook/;
        proxy_http_version 1.1;

        # These are the ones that matter. Without them nginx buffers the
        # request body, n8n can start replying before the upload finishes, and
        # the client sees a truncated or reset connection.
        proxy_request_buffering off;
        proxy_buffering         off;
        client_max_body_size    25m;

        # n8n is deliberately slow at the start of an execution, and the
        # Respond node sits at the END of the chain, so this request is held
        # open for roughly as long as the scoring takes. The default 60s nginx
        # timeout would cut it off and produce a 504 that looks like a server
        # fault. Ten minutes covers the worst case (1000 reviews).
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Pass the client's origin through so n8n can do its own checks.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Surface a useful error rather than a bare 502. If n8n is down the
        # user should be told so, not shown nginx's default page.
        proxy_intercept_errors on;
        error_page 502 503 504 = @n8n_down;
    }

    location @n8n_down {
        default_type application/json;
        return 503 '{"error":"The report service is not reachable. n8n appears to be down or still starting. Wait a moment and try again."}';
    }
}
